name: Atualizar estatísticas dos atletas

on:
  schedule:
    # 12:00 UTC corresponde a 09:00 em America/Sao_Paulo.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-athlete-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber==0.11.7
      - run: npm ci
      - name: Sincronizar elenco e treinadores da planilha online
        run: node scripts/update-athlete-roster.mjs
      - name: Ler e consolidar todas as súmulas oficiais
        run: python scripts/update-athlete-stats.py
      - name: Auditar cobertura e conciliação de gols
        run: npm run audit:athletes
      - name: Validar o portal
        run: npm run build
      - name: Publicar dados atualizados no repositório
        run: |
          if git diff --quiet -- src/data/athleteSeasonStats.js; then
            echo "Nenhuma alteração nas estatísticas."
            exit 0
          fi
          git config user.name "ad-suzano-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/athleteSeasonStats.js
          git commit -m "data: atualizar estatísticas semanais dos atletas"
          git push
