name: Update FPFS Efficiency & Standings (Subagent)

on:
  schedule:
    # Executa a cada 6 horas (no topo da hora)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-fpfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and update FPFS data & efficiency ranking
        run: node scripts/update-fpfs.mjs

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fpfsCategories.js
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualizar súmulas FPFS e Ranking de Eficiência [skip ci]"
            git push
          else
            echo "Nenhuma alteração detectada nas súmulas FPFS."
          fi
