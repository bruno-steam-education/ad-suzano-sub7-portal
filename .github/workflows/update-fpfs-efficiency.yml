name: Update FPFS and Copa da Juventude

on:
  schedule:
    # Executa a cada 3 horas (no topo da hora)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-fpfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and audit both official competitions
        run: |
          npm run update:fpfs
          npm run update:youth-league
          npm run audit:robots
          npm run build
          npm run audit:claims

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fpfsCategories.js src/data/youthLeagueCategories.js
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualizar Paulista e Copa da Juventude"
            git push
          else
            echo "Nenhuma alteração detectada nas competições."
          fi
